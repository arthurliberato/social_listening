services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://ripplewise:ripplewise@postgres:5432/ripplewise
      # Read when the app runs. Empty means nothing is sent to RudderStack; events still go to Postgres.
      RUDDERSTACK_WRITE_KEY: ${RUDDERSTACK_WRITE_KEY:-}
      RUDDERSTACK_DATA_PLANE_URL: ${RUDDERSTACK_DATA_PLANE_URL:-}
      SMTP_URL: smtp://mailpit:1025
      ALLOW_SIM_CLOCK: "true" # lets the agent harness give each agent its own clock (cookie rw_sim); leave off in production
    depends_on: [postgres, mailpit]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ripplewise
      POSTGRES_PASSWORD: ripplewise
      POSTGRES_DB: ripplewise
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata:
